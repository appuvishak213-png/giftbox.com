<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>giftbox.com</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f4f9;
        }
        /* Header & Navbar */
        header {
            background-color: #1e293b;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .cart-btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        /* Product Grid */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }
        .product-card {
            background: white;
            border-radius: 8px;
            padding: 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        .product-card img {
            max-width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 5px;
        }
        .product-title {
            font-size: 1.2rem;
            margin: 10px 0;
        }
        .product-price {
            color: #16a34a;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }
        .add-to-cart {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 0.9rem;
        }
        .add-to-cart:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">giftbox.com</div>
        <button class="cart-btn">Cart (<span id="cart-count">0</span>)</button>
    </header>

    <div class="container">
        <h2 style="margin-bottom: 1.5rem; text-align: center;">Our Products</h2>
        
        <div class="product-grid">
            <!-- Product 1 -->
            <div class="product-card">
                <img src="https://via.placeholder.com/200" alt="Product 1">
                <div class="product-title">gifts</div>
                <div class="product-price">₹</div>
                <button class="add-to-cart" onclick="addToCart()">Add to Cart</button>
            </div>
